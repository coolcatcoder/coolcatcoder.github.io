[package]
name = "mike"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.108"
bevy = { version = "0.18", default-features = false, features = [
    "web",
    "webgl2",
    "bevy_window",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_winit",
    "bevy_log",
] }

[[example]]
name = "bin"
path = "src/bin.rs"

[dev-dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "x11",
    "dynamic_linking",
] }